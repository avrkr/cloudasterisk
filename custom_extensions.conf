; Avrkr Cloud — outbound agent→user (cloudagi AGI writes live_calls / call_history)
; Channel vars from AMI Originate: callid, tenantid, agent_number, user_number (__inherited)

[calltoagent]
exten => s,1,NoOp(Avrkr calltoagent callid=${callid} tenant=${tenantid})
 same => n,Set(AGENT_NUMBER=${agent_number})
 same => n,Set(USER_NUMBER=${user_number})
 same => n,AGI(agi_call_start.py)
 same => n,UserEvent(AvrkrCallStart,CallID: ${callid},TenantID: ${tenantid},Agent: ${AGENT_NUMBER},User: ${USER_NUMBER},CallerID: ${CALLERID(all)},Direction: outbound)
 same => n,Dial(PJSIP/${AGENT_NUMBER},30,U(avrkr-answered^${callid}))
 same => n,Hangup()

exten => h,1,NoOp(Call to agent ended callid=${callid})
 same => n,AGI(agi_call_end.py)
 same => n,UserEvent(AvrkrCallEnd,CallID: ${callid},TenantID: ${tenantid},Cause: ${HANGUPCAUSE})

[calltouser]
exten => s,1,NoOp(Avrkr calltouser callid=${callid} tenant=${tenantid})
 same => n,Set(USER_NUMBER=${user_number})
 same => n,Set(CALLERID(num)=${agent_number})
 same => n,Dial(PJSIP/${USER_NUMBER},30,U(avrkr-answered^${callid}))
 same => n,Hangup()

exten => h,1,NoOp(Call to user ended callid=${callid})
 same => n,AGI(agi_call_end.py)
 same => n,UserEvent(AvrkrCallEnd,CallID: ${callid},TenantID: ${tenantid},Cause: ${HANGUPCAUSE})

; Dial U() subroutine when callee answers
[avrkr-answered]
exten => s,1,NoOp(Avrkr answered callid=${ARG1})
 same => n,Set(callid=${ARG1})
 same => n,AGI(agi_call_answered.py)
 same => n,Return()
